name: opencode

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body || github.event.issue.body, '/oc') ||
      contains(github.event.comment.body || github.event.issue.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_CONFIG_CONTENT: '{"share":"manual"}'
        with:
          model: openai/gpt-5.4
          prompt: ${{ github.event.comment.body || github.event.issue.body }}
